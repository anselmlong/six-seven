<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>six-seven | Gesture Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        padding: 24px;
        max-width: 980px;
        margin: 0 auto;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      @media (min-width: 900px) {
        .row {
          grid-template-columns: 1fr 1fr;
        }
      }
      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #111;
        overflow: hidden;
        border-radius: 12px;
      }
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      input[type="range"] {
        width: 220px;
      }
      code {
        background: #f6f6f6;
        padding: 2px 6px;
        border-radius: 6px;
      }
      pre {
        background: #0b1020;
        color: #cbe2ff;
        padding: 12px;
        border-radius: 10px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Gesture Demo</h1>
    <p>
      This page captures webcam frames and sends them to the backend at <code>/api/detect</code>.
      Your Roboflow API key stays on the server.
    </p>

    <div class="controls">
      <button id="start">Start camera</button>
      <button id="stop" disabled>Stop</button>
      <label>
        FPS
        <input id="fps" type="range" min="1" max="10" step="1" value="4" />
        <span id="fpsLabel">4</span>
      </label>
      <label>
        Max width
        <input id="maxWidth" type="range" min="320" max="960" step="80" value="640" />
        <span id="maxWidthLabel">640</span>
      </label>
    </div>

    <div class="row" style="margin-top: 16px">
      <div>
        <div class="stage">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <p id="status">Idle.</p>
      </div>
      <div>
        <h3>Last response</h3>
        <pre id="json">(none)</pre>
      </div>
    </div>

    <script>
      const video = document.getElementById("video");
      const overlay = document.getElementById("overlay");
      const statusEl = document.getElementById("status");
      const jsonEl = document.getElementById("json");

      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");

      const fpsInput = document.getElementById("fps");
      const fpsLabel = document.getElementById("fpsLabel");
      const maxWidthInput = document.getElementById("maxWidth");
      const maxWidthLabel = document.getElementById("maxWidthLabel");

      fpsInput.addEventListener("input", () => (fpsLabel.textContent = fpsInput.value));
      maxWidthInput.addEventListener("input", () => (maxWidthLabel.textContent = maxWidthInput.value));

      let stream = null;
      let timer = null;
      let inflight = false;

      const scratch = document.createElement("canvas");
      const scratchCtx = scratch.getContext("2d", { willReadFrequently: true });
      const overlayCtx = overlay.getContext("2d");

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function resizeForVideo() {
        if (!video.videoWidth || !video.videoHeight) return;
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
      }

      function drawDetections(payload) {
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

        const preds = payload?.predictions || [];
        overlayCtx.lineWidth = 3;
        overlayCtx.font = "18px system-ui";

        for (const p of preds) {
          // Roboflow detect API typically returns center x/y + width/height in pixels
          const x = p.x - p.width / 2;
          const y = p.y - p.height / 2;
          const w = p.width;
          const h = p.height;

          overlayCtx.strokeStyle = "#00ff88";
          overlayCtx.fillStyle = "#00ff88";

          overlayCtx.strokeRect(x, y, w, h);

          const label = `${p.class} ${(p.confidence * 100).toFixed(1)}%`;
          const textY = Math.max(22, y - 8);
          overlayCtx.fillText(label, x + 4, textY);
        }
      }

      async function sendFrame() {
        if (!stream) return;
        if (!video.videoWidth || !video.videoHeight) return;
        if (inflight) return;

        const maxWidth = Number(maxWidthInput.value);
        const scale = Math.min(1, maxWidth / video.videoWidth);
        const w = Math.round(video.videoWidth * scale);
        const h = Math.round(video.videoHeight * scale);

        scratch.width = w;
        scratch.height = h;
        scratchCtx.drawImage(video, 0, 0, w, h);

        const blob = await new Promise((resolve) => scratch.toBlob(resolve, "image/jpeg", 0.8));
        if (!blob) return;

        inflight = true;
        const started = performance.now();

        try {
          const form = new FormData();
          form.append("image", blob, "frame.jpg");

          const res = await fetch("/api/detect", { method: "POST", body: form });
          const payload = await res.json();

          jsonEl.textContent = JSON.stringify(payload, null, 2);

          if (!res.ok) {
            setStatus(`Error ${res.status}: ${payload?.detail || "request failed"}`);
            return;
          }

          // Scale overlay coords back up if we resized
          // Easiest approach: draw boxes against overlay in *video* pixel coordinates.
          // Roboflow predictions are in the uploaded image coords, so scale them.
          const factor = 1 / scale;
          const scaled = {
            ...payload,
            predictions: (payload.predictions || []).map((p) => ({
              ...p,
              x: p.x * factor,
              y: p.y * factor,
              width: p.width * factor,
              height: p.height * factor,
            })),
          };

          drawDetections(scaled);

          const ms = Math.round(performance.now() - started);
          const latency = payload?._meta?.latency_ms;
          setStatus(`OK: ${payload.predictions?.length || 0} detections | upload+parse ${ms}ms | roboflow ${latency ?? "?"}ms`);
        } catch (err) {
          setStatus(`Request error: ${err}`);
        } finally {
          inflight = false;
        }
      }

      async function start() {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        await video.play();
        resizeForVideo();

        startBtn.disabled = true;
        stopBtn.disabled = false;

        const tick = () => {
          const fps = Number(fpsInput.value);
          clearInterval(timer);
          timer = setInterval(sendFrame, Math.round(1000 / fps));
        };

        fpsInput.addEventListener("change", tick);
        video.addEventListener("loadedmetadata", resizeForVideo);
        window.addEventListener("resize", resizeForVideo);

        tick();
        setStatus("Camera started.");
      }

      function stop() {
        clearInterval(timer);
        timer = null;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

        if (stream) {
          for (const track of stream.getTracks()) track.stop();
          stream = null;
        }

        startBtn.disabled = false;
        stopBtn.disabled = true;
        setStatus("Stopped.");
      }

      startBtn.addEventListener("click", () => start().catch((e) => setStatus(String(e))));
      stopBtn.addEventListener("click", stop);
    </script>
  </body>
</html>
